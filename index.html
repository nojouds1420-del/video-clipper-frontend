<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SXB ISLAND 2 - قص الكليبات</title>
    <!-- استيراد الخطوط (تاجوال للعربي، وسينزل للإنجليزي الكلاسيكي) -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            /* خلفية متدرجة من الأحمر الداكن للأسود لتطابق التصميم */
            background: radial-gradient(circle at 70% 50%, #7a0000 0%, #150000 60%, #000000 100%);
            font-family: 'Tajawal', sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* الحاوية الرئيسية لتقسيم الشاشة لقسمين */
        .page-wrapper {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 60px;
            width: 90%;
            max-width: 1000px;
        }

        /* ----- تصميم المربع الأسود (نموذج القص) ----- */
        .form-container {
            background-color: #000000;
            border-radius: 25px;
            padding: 40px;
            width: 100%;
            max-width: 380px;
            /* توهج أحمر خفيف خلف المربع */
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.15);
            border: 1px solid #1a0000;
        }

        .header-titles {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-titles h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .header-titles h2 {
            margin: 0;
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .input-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .input-row label {
            font-size: 16px;
            font-weight: 700;
        }

        /* أزرار اختيار الحلقة */
        .episodes-container {
            display: flex;
            gap: 10px;
            direction: ltr; /* لترتيب الحلقات 1, 2, 3.. */
        }

        .ep-btn {
            background-color: transparent;
            border: 1px solid #550000;
            color: white;
            border-radius: 8px;
            padding: 8px 10px;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            line-height: 1.2;
        }

        .ep-btn:hover {
            background-color: #2a0000;
        }

        .ep-btn.active {
            background-color: #7a0000;
            border-color: #ff0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
        }

        /* حقول الوقت المخصصة */
        .time-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            direction: ltr;
            background-color: #111111;
            border: 1px solid #550000;
            border-radius: 10px;
            padding: 8px 15px;
            width: 140px;
        }

        .time-wrapper input {
            width: 30px;
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            font-family: monospace;
            text-align: center;
            outline: none;
        }
        
        .time-wrapper input::placeholder {
            color: #666;
        }

        .time-wrapper span {
            color: #888;
            font-weight: bold;
            margin: 0 2px;
        }

        /* زر القص الأخضر */
        .submit-btn {
            background-color: #26d367; /* لون أخضر ساطع */
            color: #000;
            border: none;
            border-radius: 30px;
            padding: 12px 40px;
            font-size: 18px;
            font-weight: 900;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            display: block;
            margin: 30px auto 0;
            transition: all 0.3s ease;
            width: 80%;
        }

        .submit-btn:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }

        .submit-btn:not(:disabled):hover {
            transform: scale(1.05);
            background-color: #20b858;
        }

        /* رسائل التنبيه والخطأ (تم تعديل ألوانها لتناسب الثيم الداكن) */
        .message { margin-top: 20px; font-size: 14px; display: none; padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; }
        .error { background: #330000; color: #ff6666; border: 1px solid #ff0000; }
        .success { background: #003311; color: #66ff99; border: 1px solid #00ff55; }

        /* ----- تصميم الشعار الجانبي (SXB ISLAND2) ----- */
        .logo-container {
            text-align: center;
        }

        .logo-text {
            font-family: 'Cinzel', serif;
            color: #fce268; /* لون ذهبي */
            line-height: 0.9;
            text-shadow: 
                2px 2px 0 #3a0000, 
                -1px -1px 0 #3a0000, 
                1px -1px 0 #3a0000, 
                -1px 1px 0 #3a0000, 
                1px 1px 0 #3a0000,
                0px 10px 20px rgba(0,0,0,0.8);
        }

        .logo-sxb {
            font-size: 100px;
            font-weight: 700;
            display: block;
            letter-spacing: 5px;
        }

        .logo-island {
            font-size: 80px;
            font-weight: 700;
            display: block;
        }

        /* تحسينات للجوال */
        @media (max-width: 768px) {
            .page-wrapper { flex-direction: column-reverse; gap: 30px; }
            .logo-sxb { font-size: 70px; }
            .logo-island { font-size: 55px; }
        }
    </style>
</head>
<body>

<div class="page-wrapper">
    <!-- المربع الأسود للقص -->
    <div class="form-container">
        <div class="header-titles">
            <h1>قص وتنزيل اللقطات</h1>
            <h2>clip maker</h2>
        </div>
        
        <!-- صف اختيار الحلقة -->
        <div class="input-row">
            <label>اختر الحلقة:</label>
            <div class="episodes-container">
                <button class="ep-btn" data-val="2">الحلقة<br>2</button>
                <button class="ep-btn" data-val="3">الحلقة<br>3</button>
                <button class="ep-btn" data-val="4">الحلقة<br>4</button>
                <button class="ep-btn" data-val="5">الحلقة<br>5</button>
            </div>
        </div>

        <!-- صف وقت البداية -->
        <div class="input-row">
            <label>وقت بداية الكليب:</label>
            <div class="time-wrapper">
                <input type="text" id="start-h" placeholder="--" inputmode="numeric" maxlength="2">
                <span>:</span>
                <input type="text" id="start-m" placeholder="--" inputmode="numeric" maxlength="2">
                <span>:</span>
                <input type="text" id="start-s" placeholder="--" inputmode="numeric" maxlength="2">
            </div>
        </div>

        <!-- صف وقت النهاية -->
        <div class="input-row">
            <label>وقت نهاية الكليب:</label>
            <div class="time-wrapper">
                <input type="text" id="end-h" placeholder="--" inputmode="numeric" maxlength="2">
                <span>:</span>
                <input type="text" id="end-m" placeholder="--" inputmode="numeric" maxlength="2">
                <span>:</span>
                <input type="text" id="end-s" placeholder="--" inputmode="numeric" maxlength="2">
            </div>
        </div>

        <button id="clipBtn" class="submit-btn" disabled>قص وتنزيل</button>
        <div id="statusMessage" class="message"></div>
    </div>

    <!-- الشعار الجانبي -->
    <div class="logo-container">
        <div class="logo-text">
            <span class="logo-sxb">SXB</span>
            <span class="logo-island">ISLAND2</span>
        </div>
    </div>
</div>

<script>
    const episodesData = {
        "1": { durationText: "01:09:56", durationSec: 4196 },
        "2": { durationText: "01:30:00", durationSec: 5400 },
        "3": { durationText: "00:45:00", durationSec: 2700 },
        "4": { durationText: "02:00:00", durationSec: 7200 },
        "5": { durationText: "01:15:30", durationSec: 4530 }
    };

    let selectedEpisode = null;
    const clipBtn = document.getElementById('clipBtn');
    const statusMessage = document.getElementById('statusMessage');

    // منطق اختيار الحلقة بالأزرار
    document.querySelectorAll('.ep-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            selectedEpisode = this.dataset.val;
            validateInputs();
        });
    });

    // دوال مساعدة للوقت
    function getSeconds(hId, mId, sId) {
        let h = parseInt(document.getElementById(hId).value) || 0;
        let m = parseInt(document.getElementById(mId).value) || 0;
        let s = parseInt(document.getElementById(sId).value) || 0;
        return (h * 3600) + (m * 60) + s;
    }

    function getFormattedTime(hId, mId, sId) {
        let h = document.getElementById(hId).value || "00";
        let m = document.getElementById(mId).value || "00";
        let s = document.getElementById(sId).value || "00";
        return `${h.padStart(2, '0')}:${m.padStart(2, '0')}:${s.padStart(2, '0')}`;
    }

    function hasAnyValue(hId, mId, sId) {
        return document.getElementById(hId).value !== '' || 
               document.getElementById(mId).value !== '' || 
               document.getElementById(sId).value !== '';
    }

    function showMessage(msg, isError = true) {
        statusMessage.textContent = msg;
        statusMessage.className = 'message ' + (isError ? 'error' : 'success');
        statusMessage.style.display = 'block';
    }

    function validateInputs() {
        statusMessage.style.display = 'none';
        clipBtn.disabled = true;

        if (!selectedEpisode || !hasAnyValue('start-h', 'start-m', 'start-s') || !hasAnyValue('end-h', 'end-m', 'end-s')) {
            return;
        }

        const startSec = getSeconds('start-h', 'start-m', 'start-s');
        const endSec = getSeconds('end-h', 'end-m', 'end-s');

        if (startSec >= endSec) {
            showMessage("وقت النهاية يجب أن يكون أكبر من وقت البداية.");
            return;
        }

        if (endSec > episodesData[selectedEpisode].durationSec) {
            showMessage(`عذراً، مدة الحلقة هي ${episodesData[selectedEpisode].durationText}. الوقت غير متوفر.`);
            return;
        }

        if (endSec - startSec > 120) {
            showMessage("تحذير: لا يمكن أن يتجاوز الكليب دقيقتين.");
            return;
        }

        statusMessage.style.display = 'none';
        clipBtn.disabled = false;
    }

    // إجبار المستخدم على إدخال أرقام فقط وتنسيقها
    document.querySelectorAll('.time-wrapper input').forEach(input => {
        input.addEventListener('input', function() {
            // مسح أي حروف والاحتفاظ بالأرقام فقط
            this.value = this.value.replace(/[^0-9]/g, '');
            validateInputs();
        });
        
        input.addEventListener('change', function() {
            if (this.value !== '' && this.value >= 0) {
                this.value = this.value.padStart(2, '0');
            }
            validateInputs();
        });
    });

    // إرسال الطلب للسيرفر
    clipBtn.addEventListener('click', async () => {
        clipBtn.disabled = true;
        showMessage("جاري المعالجة والقص... يرجى الانتظار", false);
        statusMessage.style.color = '#fff';
        statusMessage.style.borderColor = '#1edd6e';
        statusMessage.style.backgroundColor = '#004411';

        try {
            // ★ لا تنسَ تحديث هذا الرابط برابط Railway الخاص بك ★
            const SERVER_URL = 'https://video-clipper-backend-production-d460.up.railway.app/clip'; 
            
            const finalStartTime = getFormattedTime('start-h', 'start-m', 'start-s');
            const finalEndTime = getFormattedTime('end-h', 'end-m', 'end-s');

            const response = await fetch(SERVER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    episode: selectedEpisode,
                    startTime: finalStartTime,
                    endTime: finalEndTime
                })
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(errorText || "حدث خطأ في السيرفر");
            }

            const blob = await response.blob();
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = `clip_ep${selectedEpisode}_${finalStartTime.replace(/:/g, '')}.mp4`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(downloadUrl); 

            showMessage("تم التنزيل بنجاح!", false);
            clipBtn.disabled = false;

        } catch (error) {
            showMessage(error.message || "حدث خطأ أثناء الاتصال بالخادم.");
            clipBtn.disabled = false;
        }
    });
</script>
</body>
</html>
