<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة قص الكليبات</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .message { margin-top: 15px; font-size: 14px; display: none; padding: 10px; border-radius: 5px; }
        .error { background: #ffe6e6; color: #d9534f; border: 1px solid #d9534f; }
        .success { background: #dff0d8; color: #3c763d; border: 1px solid #3c763d; }
    </style>
</head>
<body>

<div class="container">
    <h2>قص وتنزيل كليب</h2>
    
    <div class="form-group">
        <label>رقم الحلقة:</label>
        <select id="episodeSelect">
            <option value="">اختر الحلقة...</option>
            <option value="1">الحلقة 1</option>
            <option value="2">الحلقة 2</option>
            <option value="3">الحلقة 3</option>
            <option value="4">الحلقة 4</option>
            <option value="5">الحلقة 5</option>
        </select>
    </div>

    <div class="form-group">
        <label>وقت البداية (مثال 01:01:33):</label>
        <input type="text" id="startTime" placeholder="HH:MM:SS">
    </div>

    <div class="form-group">
        <label>وقت النهاية (مثال 01:02:28):</label>
        <input type="text" id="endTime" placeholder="HH:MM:SS">
    </div>

    <button id="clipBtn" disabled>قص وصنع الكليب</button>
    <div id="statusMessage" class="message"></div>
</div>

<script>
    const episodesData = {
        "1": { durationText: "01:09:56", durationSec: 4196 },
        "2": { durationText: "01:30:00", durationSec: 5400 },
        "3": { durationText: "00:45:00", durationSec: 2700 },
        "4": { durationText: "02:00:00", durationSec: 7200 },
        "5": { durationText: "01:15:30", durationSec: 4530 }
    };

    const episodeSelect = document.getElementById('episodeSelect');
    const startTimeInput = document.getElementById('startTime');
    const endTimeInput = document.getElementById('endTime');
    const clipBtn = document.getElementById('clipBtn');
    const statusMessage = document.getElementById('statusMessage');

    function timeToSeconds(timeStr) {
        const parts = timeStr.split(':').map(Number);
        if (parts.length === 3) return (parts[0] * 3600) + (parts[1] * 60) + parts[2];
        if (parts.length === 2) return (parts[0] * 60) + parts[1];
        return -1;
    }

    function showMessage(msg, isError = true) {
        statusMessage.textContent = msg;
        statusMessage.className = 'message ' + (isError ? 'error' : 'success');
        statusMessage.style.display = 'block';
    }

    function validateInputs() {
        statusMessage.style.display = 'none';
        clipBtn.disabled = true;

        const epId = episodeSelect.value;
        const startVal = startTimeInput.value.trim();
        const endVal = endTimeInput.value.trim();

        if (!epId || !startVal || !endVal) return;

        const timeRegex = /^(?:(?:[0-1][0-9]|2[0-3]):)?(?:[0-5][0-9]):(?:[0-5][0-9])$/;
        if (!timeRegex.test(startVal) || !timeRegex.test(endVal)) {
            showMessage("الرجاء إدخال الوقت بصيغة صحيحة مثل 01:01:33");
            return;
        }

        const startSec = timeToSeconds(startVal);
        const endSec = timeToSeconds(endVal);

        if (startSec >= endSec) {
            showMessage("وقت النهاية يجب أن يكون أكبر من وقت البداية.");
            return;
        }

        if (endSec > episodesData[epId].durationSec) {
            showMessage(`عذراً، مدة الحلقة هي ${episodesData[epId].durationText}. الوقت غير متوفر.`);
            return;
        }

        if (endSec - startSec > 120) {
            showMessage("تحذير: لا يمكن أن يتجاوز الكليب دقيقتين.");
            return;
        }

        statusMessage.style.display = 'none';
        clipBtn.disabled = false;
    }

    episodeSelect.addEventListener('change', validateInputs);
    startTimeInput.addEventListener('input', validateInputs);
    endTimeInput.addEventListener('input', validateInputs);

    clipBtn.addEventListener('click', async () => {
        clipBtn.disabled = true;
        showMessage("جاري المعالجة والقص... يرجى الانتظار", false);
        statusMessage.style.color = '#007bff';
        statusMessage.style.borderColor = '#007bff';
        statusMessage.style.backgroundColor = '#e6f2ff';

        try {
            // ضع رابط Google Cloud Run هنا بعد رفعه
            const SERVER_URL = 'video-clipper-backend-production-d460.up.railway.app/clip'; 
            
            const response = await fetch(SERVER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    episode: episodeSelect.value,
                    startTime: startTimeInput.value,
                    endTime: endTimeInput.value
                })
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(errorText || "حدث خطأ في السيرفر");
            }

            const blob = await response.blob();
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = `clip_ep${episodeSelect.value}_${startTimeInput.value.replace(/:/g, '')}.mp4`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(downloadUrl); // تفريغ الذاكرة

            showMessage("تم التنزيل بنجاح!", false);
            clipBtn.disabled = false;

        } catch (error) {
            showMessage(error.message || "حدث خطأ أثناء الاتصال بالخادم.");
            clipBtn.disabled = false;
        }
    });
</script>
</body>
</html>
